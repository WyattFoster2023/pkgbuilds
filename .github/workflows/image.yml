name: image
on:
  schedule: [{cron: '0 5 * * 1'}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [docker/**]
jobs:
  image:
    runs-on: pkgbuilds-build
    steps:
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REG" -u "$REGISTRY_USERNAME" --password-stdin
          docker build --no-cache -t "$REG/archbuild:latest" docker
          docker push "$REG/archbuild:latest"
        env:
          REG: zot.registry.svc.cluster.local:5000
