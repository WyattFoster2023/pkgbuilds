name: update-check
on:
  schedule: [{cron: '30 3 * * *'}]
  workflow_dispatch:
permissions: {contents: write, pull-requests: write, actions: write}
jobs:
  check:
    runs-on: pkgbuilds-build
    steps:
      - uses: actions/checkout@v4
      - name: nvchecker, then PR newer AUR recipes
        shell: bash
        run: |
          # Everything runs in the image on a copy (builder cannot write the runner-owned
          # checkout, and the runner has no gh); the copy's origin/credentials come with .git.
          docker run --rm -v "$PWD:/src:ro" -w /home/builder -e GH_TOKEN "$REG/archbuild:latest" \
            bash -c 'cp -a /src /home/builder/w && cd /home/builder/w \
              && git config --global --add safe.directory "*" \
              && scripts/old-versions.sh && nvchecker -c nvchecker.toml \
              && nvcmp -c nvchecker.toml | tee report.txt \
              && scripts/open-update-prs.sh report.txt'
        env: {REG: 'zot.registry.svc.cluster.local:5000', GH_TOKEN: '${{ github.token }}'}
